{{ $type := default "Theorem" (.Get "type") }}
{{ $name := .Get "name" }}
<div class="not-prose border-s-4 border-primary-400 dark:border-primary-500 bg-neutral-100 dark:bg-neutral-700 px-4 py-3 mt-6 mb-2 rounded">
  <p class="mb-1"><strong>{{ $type }}{{ if $name }} ({{ $name }}){{ end }}.</strong></p>
  <div class="theorem-content italic">{{- .Inner | markdownify -}}</div>
</div>
